name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name JRYBeats JRYBeats.py

      - name: Create portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\JRYBeats.exe release\JRYBeats.exe
          Compress-Archive -Path release\JRYBeats.exe -DestinationPath JRYBeats-${{ github.ref_name }}-portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JRYBeats.exe
            JRYBeats-${{ github.ref_name }}-portable.zip
          generate_release_notes: true
