name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build JRYBeats EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name JRYBeats JRYBeats.py

      - name: Create portable ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\JRYBeats.exe release\JRYBeats.exe
          Compress-Archive -Path release\JRYBeats.exe -DestinationPath JRYBeats-${{ github.ref_name }}-portable.zip

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JRYBeats.exe
            JRYBeats-${{ github.ref_name }}-portable.zip
            installer-output/JRYBeats_1.0.0_x64-setup.exe
          generate_release_notes: true
